services:
  - type: web
    name: sayada-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.9.0
      - key: N8N_WEBHOOK_BASE_URL
        sync: false # User must provide this in dashboard
      - key: API_KEY
        generateValue: true
